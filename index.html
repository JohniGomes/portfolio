<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Johni Michael | Projetos construídos</title>
  <meta name="description" content="Portfolio de Johni Michael: sistemas, automações e dashboards construídos e entregues em produção." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:       #F2E6D8;
      --panel:       #FFFDF9;
      --olive:       #555934;
      --olive-deep:  #3f4227;
      --tan:         #BF9B7A;
      --tan-deep:    #a3714a;
      --brown:       #8C5B3E;
      --brown-dark:  #593E2E;
      --text:        #3D2A1F;
      --text-soft:   #6B5744;
      --line:        #DCC9B0;
      --radius-lg:   28px;
      --radius-md:   18px;
    }

    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: var(--brown-dark);
      height: 72px;
      display: flex;
      align-items: center;
      padding: 0 2rem;
      justify-content: space-between;
    }
    .nav-logo {
      display: flex; align-items: center;
      text-decoration: none;
    }
    .nav-logo img { height: 40px; width: auto; display: block; }
    .nav-links { display: flex; align-items: center; gap: 1.5rem; list-style: none; }
    .nav-links a {
      color: rgba(242,230,216,0.8);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--cream); }
    .nav-cta {
      background: var(--cream);
      color: var(--brown-dark) !important;
      padding: 0.55rem 1.25rem;
      border-radius: 999px;
      font-weight: 700 !important;
      font-size: 0.82rem !important;
      transition: background 0.2s !important;
    }
    .nav-cta:hover { background: var(--tan) !important; }

    /* ── HERO / STAGE ── */
    #hero {
      position: relative;
      overflow: hidden;
      background: #ffffff;
      padding: 120px 1.5rem 6rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .stage-panel {
      position: relative;
      z-index: 2;
      max-width: 980px;
      margin: 0 auto;
      width: 100%;
      background: var(--panel);
      border-radius: var(--radius-lg);
      box-shadow: 0 30px 80px rgba(89,62,46,0.18), 0 2px 0 rgba(89,62,46,0.04);
      padding: 2.5rem 2.5rem 2rem;
      border: 1px solid rgba(220,201,176,0.6);
    }

    .stage-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 1.75rem;
    }

    /* ── VIEW SWITCH ── */
    .view-switch {
      display: inline-flex;
      gap: 2px;
      padding: 4px;
      background: var(--brown-dark);
      border-radius: 999px;
      flex-shrink: 0;
      margin-left: auto;
    }
    .view-switch button {
      width: 38px; height: 34px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: rgba(242,230,216,0.55);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .view-switch button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .view-switch button:hover { color: var(--cream); }
    .view-switch button.active { background: rgba(255,255,255,0.16); color: var(--cream); }

    .view-panel { display: none; }
    .view-panel.active { display: block; }

    /* ── SHARED CARD FACE ── */
    .card-media { position: absolute; inset: 0; background-size: cover; background-position: center; background-color: var(--brown); }
    .card-media-slideshow { position: absolute; inset: 0; overflow: hidden; }
    .card-media-frame {
      position: absolute; inset: 0;
      background-size: cover; background-position: center; background-color: var(--brown);
      opacity: 0; transition: opacity 1.4s ease;
      animation-duration: 10s; animation-timing-function: ease-in-out;
      animation-iteration-count: infinite; animation-direction: alternate;
      will-change: transform;
    }
    .card-media-frame.active { opacity: 1; }
    .card-media-frame.kb-a { animation-name: kenburnsA; }
    .card-media-frame.kb-b { animation-name: kenburnsB; }
    @keyframes kenburnsA { 0% { transform: scale(1) translate(0, 0); } 100% { transform: scale(1.16) translate(-3%, -2%); } }
    @keyframes kenburnsB { 0% { transform: scale(1.1) translate(-2%, 1%); } 100% { transform: scale(1.22) translate(1%, -3%); } }
    .card-word {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; color: rgba(255,255,255,0.92);
      letter-spacing: -0.02em; text-align: center; pointer-events: none;
    }
    .card-gallery-btn {
      position: absolute; top: 14px; right: 14px;
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--brown-dark);
      display: flex; align-items: center; justify-content: center;
      color: var(--cream); text-decoration: none; font-size: 1rem;
      z-index: 3; border: none; cursor: pointer; transition: background 0.2s;
    }
    .card-gallery-btn:hover { background: var(--olive-deep); }
    .card-count {
      position: absolute; top: 14px; right: 14px; z-index: 2;
      background: rgba(255,255,255,0.22); backdrop-filter: blur(6px);
      color: #fff; font-size: 0.65rem; font-weight: 700;
      padding: 0.2rem 0.55rem; border-radius: 999px;
    }

    /* ── STACK VIEW ── */
    .stack-viewport { position: relative; height: 560px; touch-action: pan-y; }
    .stack-card {
      position: absolute; inset: 0; margin: auto;
      width: min(600px, 100%); height: 100%;
      border-radius: var(--radius-md);
      overflow: hidden; cursor: grab;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 24px 55px rgba(61,42,31,0.2);
      transition: transform 0.5s cubic-bezier(.22,1,.36,1), opacity 0.5s ease;
      user-select: none;
      display: flex; flex-direction: column;
    }
    .stack-card.dragging { transition: none; cursor: grabbing; }
    .stack-card-visual { position: relative; flex: 0 0 380px; overflow: hidden; }
    .stack-card .card-word { font-size: clamp(1.6rem, 4.4vw, 2.6rem); padding: 2rem; }
    .stack-card-caption { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 1.5rem; overflow: hidden; }
    .stack-card-type { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--brown); margin-bottom: 0.4rem; }
    .stack-card-caption h3 { font-size: 1.2rem; font-weight: 800; margin-bottom: 0.4rem; letter-spacing: -0.01em; color: var(--text); }
    .stack-card-caption p { font-size: 0.85rem; color: var(--text-soft); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

    .stack-meta { display: flex; align-items: center; justify-content: flex-end; margin-top: 1.75rem; }
    .stack-nav { display: flex; gap: 0.5rem; }
    .stack-nav button {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid var(--line); background: var(--panel); color: var(--text);
      font-size: 1.1rem; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .stack-nav button:hover { background: var(--brown-dark); color: var(--cream); border-color: var(--brown-dark); }

    /* ── GRID VIEW ── */
    .grid-view { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
    .grid-card {
      border-radius: 16px; overflow: hidden;
      cursor: pointer; background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 10px 30px rgba(61,42,31,0.1);
      transition: transform 0.25s, box-shadow 0.25s;
    }
    .grid-card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(61,42,31,0.18); }
    .grid-card-visual { position: relative; aspect-ratio: 4 / 3; overflow: hidden; }
    .grid-card .card-word { font-size: 1.1rem; padding: 1rem; }
    .grid-card-caption { padding: 1rem 1.1rem 1.1rem; }
    .grid-card-type { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--brown); margin-bottom: 0.3rem; }
    .grid-card-caption h3 { font-size: 0.95rem; font-weight: 800; letter-spacing: -0.01em; color: var(--text); margin-bottom: 0.35rem; }
    .grid-card-caption p { font-size: 0.78rem; color: var(--text-soft); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* ── LIST VIEW ── */
    .list-view { display: flex; gap: 1rem; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 0.75rem; }
    .list-view::-webkit-scrollbar { height: 6px; }
    .list-view::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }
    .list-item {
      flex: 0 0 auto; width: 270px; scroll-snap-align: start;
      border-radius: 16px; overflow: hidden; background: var(--panel);
      border: 1px solid var(--line); cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }
    .list-item:hover { transform: translateY(-3px); border-color: var(--brown); }
    .list-item-thumb { position: relative; height: 150px; overflow: hidden; }
    .list-item-thumb .card-word { font-size: 0.95rem; padding: 0.75rem; }
    .list-item-body { padding: 0.9rem 1.1rem 1.1rem; }
    .list-item-type { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--brown); margin-bottom: 0.35rem; }
    .list-item-body h3 { font-size: 0.95rem; font-weight: 800; margin-bottom: 0.4rem; letter-spacing: -0.01em; color: var(--text); }
    .list-item-body p { font-size: 0.78rem; color: var(--text-soft); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

    /* ── LIGHTBOX ── */
    .lightbox {
      position: fixed; inset: 0; z-index: 1000;
      display: none; align-items: center; justify-content: center;
      padding: 2rem 1rem;
    }
    .lightbox.open { display: flex; }
    .lightbox-backdrop { position: absolute; inset: 0; background: rgba(61,42,31,0.88); }
    .lightbox-inner { position: relative; z-index: 1; max-width: 900px; width: 100%; display: flex; flex-direction: column; align-items: center; }
    .lightbox-img { max-width: 100%; max-height: 68vh; border-radius: 14px; box-shadow: 0 30px 70px rgba(0,0,0,0.5); object-fit: contain; background: var(--brown-dark); }
    .lightbox-close {
      position: absolute; top: -50px; right: 0;
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--brown-dark); color: var(--cream); border: none;
      font-size: 1.4rem; cursor: pointer; transition: background 0.2s;
    }
    .lightbox-close:hover { background: var(--olive-deep); }
    .lightbox-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 46px; height: 46px; border-radius: 50%;
      background: var(--brown-dark); color: var(--cream); border: none;
      font-size: 1.4rem; cursor: pointer; transition: background 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .lightbox-arrow:hover { background: var(--olive-deep); }
    .lightbox-prev { left: -8px; }
    .lightbox-next { right: -8px; }
    .lightbox-caption { margin-top: 1.25rem; text-align: center; color: var(--cream); }
    .lightbox-caption h4 { font-size: 1.05rem; font-weight: 800; margin-bottom: 0.3rem; }
    .lightbox-caption span { font-size: 0.78rem; color: rgba(242,230,216,0.65); font-weight: 600; }

    /* ── FOOTER ── */
    footer { background: var(--panel); padding: 1.75rem 2rem; text-align: center; color: var(--text-soft); font-size: 0.78rem; border-top: 1px solid var(--line); }

    /* ── ANIMAÇÕES ── */
    .fade-up { opacity: 0; transform: translateY(20px); transition: opacity 0.55s ease, transform 0.55s ease; }
    .fade-up.visible { opacity: 1; transform: translateY(0); }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .grid-view { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 720px) {
      .stage-panel { padding: 1.75rem 1.25rem 1.5rem; }
      .stack-viewport { height: 520px; }
      .stack-card-visual { flex-basis: 340px; }
      .stack-card-caption { padding: 1.25rem; }
      .stack-card-caption h3 { font-size: 1.05rem; }
      .stack-card-caption p { -webkit-line-clamp: 2; }
      .nav-links { gap: 0.75rem; }
      .nav-links a:not(.nav-cta) { display: none; }
      .lightbox-arrow { width: 38px; height: 38px; font-size: 1.15rem; }
      .lightbox-prev { left: -2px; }
      .lightbox-next { right: -2px; }
    }
    @media (max-width: 480px) {
      .grid-view { grid-template-columns: 1fr; }
      .stack-viewport { height: 480px; }
      .stack-card-visual { flex-basis: 310px; }
    }
  </style>
</head>

    function faceHTML(p) {
      if (p.images.length > 1) {
        const pos = p.pos || 'center';
        const frames = p.images.map((img, i) => `<div class="card-media-frame ${i % 2 === 0 ? 'kb-a' : 'kb-b'}${i === 0 ? ' active' : ''}" style="background-image:url('${img}');background-position:${pos}"></div>`).join('');
        return `<div class="card-media-slideshow">${frames}</div>`;
      }
      if (p.images.length === 1) {
        return `<div class="card-media-slideshow"><div class="card-media-frame kb-a active" style="background-image:url('${p.images[0]}');background-position:${p.pos || 'center'}"></div></div>`;
      }
      return `<div class="card-media" style="background-color:${p.color}"></div><div class="card-word">${p.word}</div>`;
    }

    function initMediaSlideshows(root) {
      root.querySelectorAll('.card-media-slideshow').forEach((el) => {
        const frames = Array.from(el.children);
        if (frames.length <= 1) return;
        let idx = 0;
        setInterval(() => {
          frames[idx].classList.remove('active');
          idx = (idx + 1) % frames.length;
          frames[idx].classList.add('active');
        }, 3600 + Math.random() * 900);
      });
    }

    // ── Scroll fade ──
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
    }, { threshold: 0.08 });
    document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));

    // ── STACK VIEW ──
    const viewport = document.getElementById('stackViewport');
    viewport.innerHTML = PROJECTS.map((p, i) => `
      <div class="stack-card" data-index="${i}">
        <div class="stack-card-visual">
          ${faceHTML(p)}
          ${p.images.length > 1 ? `<button class="card-gallery-btn" data-gallery="${i}" aria-label="Ver fotos">⊞</button>` : ''}
        </div>
        <div class="stack-card-caption">
          <div class="stack-card-type">${p.type}</div>
          <h3>${p.name}</h3>
          <p>${p.desc}</p>
        </div>
      </div>
    `).join('');
    initMediaSlideshows(viewport);

    const cards = Array.from(viewport.querySelectorAll('.stack-card'));
    const total = cards.length;
    let active = 0;

    function render() {
      cards.forEach((card, i) => {
        const offset = i - active;
        if (offset < 0) {
          card.style.transform = 'translateX(-140%) rotate(-8deg)';
          card.style.opacity = '0'; card.style.zIndex = 0; card.style.pointerEvents = 'none';
        } else if (offset === 0) {
          card.style.transform = 'translateX(0) translateY(0) scale(1)';
          card.style.opacity = '1'; card.style.zIndex = 50; card.style.pointerEvents = 'auto';
        } else if (offset <= 3) {
          const s = 1 - offset * 0.05, y = offset * 14;
          card.style.transform = `translateY(${y}px) scale(${s})`;
          card.style.opacity = '1'; card.style.zIndex = 50 - offset; card.style.pointerEvents = 'none';
        } else {
          card.style.opacity = '0'; card.style.zIndex = 0; card.style.pointerEvents = 'none';
        }
      });
    }

    function next() { active = (active + 1) % total; render(); }
    function prev() { active = (active - 1 + total) % total; render(); }
    document.getElementById('nextBtn').addEventListener('click', next);
    document.getElementById('prevBtn').addEventListener('click', prev);

    let dragging = false, startX = 0, dragX = 0, dragCard = null;
    viewport.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.card-gallery-btn')) return;
      const card = e.target.closest('.stack-card');
      if (!card || Number(card.dataset.index) !== active) return;
      dragging = true; startX = e.clientX; dragX = 0; dragCard = card;
      card.classList.add('dragging'); card.setPointerCapture(e.pointerId);
    });
    viewport.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      dragX = e.clientX - startX;
      dragCard.style.transform = `translateX(${dragX}px) rotate(${dragX / 20}deg)`;
    });
    function endDrag() {
      if (!dragging) return;
      dragging = false; dragCard.classList.remove('dragging');
      if (dragX < -90) next(); else if (dragX > 90) prev(); else render();
      dragX = 0; dragCard = null;
    }
    viewport.addEventListener('pointerup', endDrag);
    viewport.addEventListener('pointerleave', endDrag);

    render();

    // ── GRID VIEW ──
    const gridView = document.getElementById('gridView');
    gridView.innerHTML = PROJECTS.map((p, i) => `
      <div class="grid-card" data-open="${i}">
        <div class="grid-card-visual">
          ${faceHTML(p)}
          ${p.images.length > 1 ? `<div class="card-count">${p.images.length} fotos</div>` : ''}
        </div>
        <div class="grid-card-caption">
          <div class="grid-card-type">${p.type}</div>
          <h3>${p.name}</h3>
          <p>${p.desc}</p>
        </div>
      </div>
    `).join('');
    initMediaSlideshows(gridView);

    // ── LIST VIEW ──
    const listView = document.getElementById('listView');
    listView.innerHTML = PROJECTS.map((p, i) => `
      <div class="list-item" data-open="${i}">
        <div class="list-item-thumb">
          ${faceHTML(p)}
          ${p.images.length > 1 ? `<div class="card-count">${p.images.length} fotos</div>` : ''}
        </div>
        <div class="list-item-body">
          <div class="list-item-type">${p.type}</div>
          <h3>${p.name}</h3>
          <p>${p.desc}</p>
        </div>
      </div>
    `).join('');
    initMediaSlideshows(listView);

    // ── VIEW SWITCH ──
    const switchBtns = Array.from(document.querySelectorAll('.view-switch button'));
    const panels = { stack: document.getElementById('viewStack'), grid: document.getElementById('viewGrid'), list: document.getElementById('viewList') };
    switchBtns.forEach(btn => btn.addEventListener('click', () => {
      switchBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      Object.values(panels).forEach(p => p.classList.remove('active'));
      panels[btn.dataset.view].classList.add('active');
    }));

    // ── LIGHTBOX ──
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightboxImg');
    const lbTitle = document.getElementById('lightboxTitle');
    const lbCount = document.getElementById('lightboxCount');
    let lbProject = 0, lbIndex = 0;

    function openLightbox(projectIndex, imageIndex) {
      const p = PROJECTS[projectIndex];
      if (!p.images.length) return;
      lbProject = projectIndex; lbIndex = imageIndex || 0;
      renderLightbox();
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
    }
    function renderLightbox() {
      const p = PROJECTS[lbProject];
      lbImg.src = p.images[lbIndex];
      lbImg.alt = p.name;
      lbTitle.textContent = p.name;
      lbCount.textContent = `${lbIndex + 1} / ${p.images.length}`;
    }
    function closeLightbox() { lightbox.classList.remove('open'); lightbox.setAttribute('aria-hidden', 'true'); }
    function lbNext() { const p = PROJECTS[lbProject]; lbIndex = (lbIndex + 1) % p.images.length; renderLightbox(); }
    function lbPrev() { const p = PROJECTS[lbProject]; lbIndex = (lbIndex - 1 + p.images.length) % p.images.length; renderLightbox(); }

    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    document.getElementById('lightboxBackdrop').addEventListener('click', closeLightbox);
    document.getElementById('lightboxNext').addEventListener('click', lbNext);
    document.getElementById('lightboxPrev').addEventListener('click', lbPrev);

    viewport.addEventListener('click', (e) => {
      const btn = e.target.closest('.card-gallery-btn');
      if (btn) openLightbox(Number(btn.dataset.gallery), 0);
    });
    gridView.addEventListener('click', (e) => {
      const card = e.target.closest('.grid-card');
      if (card) openLightbox(Number(card.dataset.open), 0);
    });
    listView.addEventListener('click', (e) => {
      const item = e.target.closest('.list-item');
      if (item) openLightbox(Number(item.dataset.open), 0);
    });

    document.addEventListener('keydown', (e) => {
      if (lightbox.classList.contains('open')) {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowRight') lbNext();
        if (e.key === 'ArrowLeft') lbPrev();
        return;
      }
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft') prev();
    });
  </script>
</body>
</html>
